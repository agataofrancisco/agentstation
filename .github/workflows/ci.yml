name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not postgres and not redis"
      # pgserver arranca um PostgreSQL real dentro do runner, sem Docker.
      - run: pytest -m postgres
      - run: python -m eval.runner --reps 1 --out /tmp/eval.json
